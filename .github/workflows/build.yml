name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller PicSort.spec
      - run: Rename-Item dist/PicSort.exe PicSort-windows.exe
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: PicSort-windows
          path: dist/PicSort-windows.exe

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller PicSort.spec
      - run: ditto -c -k --keepParent dist/PicSort.app dist/PicSort-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PicSort-macos
          path: dist/PicSort-macos.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/PicSort-windows.exe
            artifacts/PicSort-macos.zip
          generate_release_notes: true
