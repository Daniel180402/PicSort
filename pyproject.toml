[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "picsort"
version = "2.0.0"
description = "Sort, deduplicate and clean up large photo collections"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "Pillow>=10",
    "imagehash>=4.3",
    "numpy>=1.24",
    "send2trash>=1.8",
    "pillow-heif>=0.15",
]

[project.optional-dependencies]
faces = ["face_recognition", "scikit-learn", "numpy"]
dev = ["pytest"]

[project.gui-scripts]
picsort = "picsort.gui.app:main"

[tool.setuptools.packages.find]
include = ["picsort*"]

[tool.setuptools.package-data]
picsort = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
